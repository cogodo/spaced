services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount Firebase credentials (don't bake into image)
      - ./firebase_service_account.json:/app/firebase_service_account.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase_service_account.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
