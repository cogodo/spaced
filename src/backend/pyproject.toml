[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
dependencies = [
    # Core
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",

    # Firebase
    "firebase-admin",

    # LLM
    "anthropic>=0.40.0,<1.0.0",
    "openai>=1.0.0,<2.0.0",

    # Utils
    "tenacity",
    "requests",
    "fsrs",
    "httpx",
    "psutil",
]

[project.optional-dependencies]
# Voice agent - install separately on a beefier machine
voice = [
    "livekit-agents[deepgram,openai,cartesia,silero,turn-detector]~=1.0",
    "livekit-plugins-noise-cancellation~=0.2",
]
dev = [
    "ruff",
    "pre-commit",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
]

[project.scripts]
start-backend = "app.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F841"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "app*", "core*", "infrastructure*", "middleware*"]
